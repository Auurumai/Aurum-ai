<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURUM AI Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <h1>🟨 AURUM AI</h1>
        <p class="subtitle">
            Institutional Gold Intelligence Platform
        </p>
    </div>

    <div class="container">

        <!-- Upload Card -->
        <div class="card">
            <h2>📊 Gold Chart Analysis</h2>

            <input type="file" id="chart" accept="image/*">

            <img id="preview"
                 style="display:none;width:100%;margin-top:20px;border-radius:10px;">

            <button id="analyzeBtn">
                Analyze with AI
            </button>
        </div>

        <!-- AI Report -->
        <div class="card">

    <h2>🤖 AI Intelligence Report</h2>

    <hr>

    <p id="trend">
        <strong>📈 Market Trend:</strong> Waiting...
    </p>

    <p id="confidence">
        <strong>🎯 Confidence Score:</strong> --%
    </p>

    <p id="recommendation">
        <strong>💰 Recommendation:</strong> Waiting...
    </p>

    <p id="risk">
        <strong>⚠️ Risk Level:</strong> Waiting...
    </p>

    <p id="timeframe">
        <strong>🕒 Timeframe:</strong> 1H
    </p>

    <p id="status">
        <strong>📊 Market Status:</strong> Waiting...
    </p>

</div>


    <script src="script.js"></script>

</body>
</html>
