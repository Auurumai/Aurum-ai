<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AURUM AI Dashboard</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #050505;
    color: #f5c542;
}

header {
    padding: 25px;
    text-align: center;
    border-bottom: 1px solid #333;
}

h1 {
    font-size: 38px;
    margin: 0;
}

.subtitle {
    color: #ddd;
    margin-top: 10px;
}

.container {
    padding: 30px;
    display: grid;
    gap: 25px;
}

.card {
    background: #111;
    border: 1px solid #333;
    border-radius: 15px;
    padding: 25px;
}

.card h2 {
    color: #f5c542;
}

.upload {
    border: 2px dashed #f5c542;
    padding: 40px;
    text-align: center;
    border-radius: 15px;
}

button {
    margin-top: 20px;
    background: #f5c542;
    color: black;
    border: none;
    padding: 15px 35px;
    border-radius: 30px;
    font-size: 16px;
    cursor: pointer;
}

.score {
    font-size: 40px;
    font-weight: bold;
}
</style>

</head>

<body>

<header>
<h1>⚜ AURUM AI</h1>
<div class="subtitle">
Institutional Gold Intelligence Platform
</div>
</header>


<div class="container">

<div class="card">
<h2>Chart Analyzer</h2>

<div class="upload">
Upload XAUUSD Chart Image
<br>

<input type="file">

<br>

<button>
Analyze Chart
</button>

</div>

</div>


<div class="card">

<h2>AI Market Analysis</h2>

<p>
Trend: Waiting for analysis...
</p>

<p>
Market Structure: Not detected
</p>

<p>
Gann Square 9 / 144: Pending
</p>

</div>


<div class="card">

<h2>AI Confidence Score</h2>

<div class="score">
-- %
</div>

</div>


<div class="card">

<h2>Risk Management</h2>

<p>
Entry: --
</p>

<p>
Stop Loss: --
</p>

<p>
Take Profit: --
</p>

</div>


</div>

</body>
  </html>
