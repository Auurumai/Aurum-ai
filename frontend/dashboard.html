<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AURUM AI Dashboard</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>
<h1>⚜ AURUM AI</h1>
<div class="subtitle">
Institutional Gold Intelligence Platform
</div>
</header>


<div class="container">

<div class="card">
<h2>Chart Analyzer</h2>

<div class="upload">
    <input type="file" id="chartImage" accept="image/*">
</div>


<br>
<img id="preview" style="display:none;width:100%;margin-top:20px;border-radius:10px;">
<button id="analyzeBtn">
    Analyze Chart
</button>

</div>

</div>


<div class="card">

<h2>AI Market Analysis</h2>

<p>
Trend: Waiting for analysis...
</p>

<p>
Market Structure: Not detected
</p>

<p>
Gann Square 9 / 144: Pending
</p>

</div>


<div class="card">

<h2>AI Confidence Score</h2>

<div class="score">
-- %
</div>

</div>


<div class="card">

<h2>Risk Management</h2>

<p>
Entry: --
</p>

<p>
Stop Loss: --
</p>

<p>
Take Profit: --
</p>

</div>


</div>
<script>
const input = document.getElementById("chartImage");
const preview = document.getElementById("preview");

input.addEventListener("change", function () {
    const file = this.files[0];
    if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";
    }
});
</script>
</body>
  </html>
